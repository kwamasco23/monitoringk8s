apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: monitoring-ingress

spec:

  ingressClassName: traefik

  rules:

    - host: monitoring.local

      http:

        paths:

          - path: /
            pathType: Prefix

            backend:

              service:
                name: monitoring-service
                port:
                  number: 80